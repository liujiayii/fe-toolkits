name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
        # 不设置 registry-url：它会导出占位 NODE_AUTH_TOKEN，导致 npm 走 token 认证而跳过 OIDC

      # OIDC trusted publishing 要求 npm CLI >= 11.5.1，Node 22 自带的是 10.x
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Create release pull request or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不传 NPM_TOKEN/NODE_AUTH_TOKEN：npm CLI 检测到 GitHub Actions 环境后
          # 自动走 OIDC trusted publishing（绑定关系配置在 npm 包设置的 Trusted Publisher）
          NPM_CONFIG_PROVENANCE: 'true'
